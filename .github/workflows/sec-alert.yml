name: sec-alert

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub often runs a few minutes late)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: sec-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # always start from the newest saved state, not the one from when the run was queued

      - name: Check filings
        run: python3 sec_alert.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SEC_UA: ${{ secrets.SEC_UA }}

      - name: Save state
        run: |
          git config user.name "sec-alert-bot"
          git config user.email "sec-alert-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
